[project]
name = "system3-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "supabase>=2.6",
  "httpx>=0.27",
  # Mindestens 1.66: personalize.generate ruft client.responses.create auf,
  # und die Responses-API gibt es erst ab dieser Fassung. Mit der zuvor
  # erlaubten 1.40 laeuft der Worker an, scheitert aber bei JEDEM
  # Modellaufruf mit "'OpenAI' object has no attribute 'responses'".
  # Gemessen am 2026-08-30 auf dieser Maschine: installiert war 1.54.4,
  # und damit konnte weder ein Icebreaker noch ein Website-Befund
  # geschrieben werden.
  "openai>=1.66",
  "cryptography>=43.0",
  "pydantic-settings>=2.4",
  "trafilatura>=1.12",
  "tenacity>=9.0",
  # Die zweite Stufe des Website-Checks (website_browser.py). Fehlte hier bis
  # zum 2026-08-31, und das war nicht folgenlos: der Import steckt in
  # BrowserPool._start und der Fehler wird von measure() gefangen, also endete
  # jede Messung auf Railway als Ergebnis "failed" statt als Absturz. Gemessen
  # ueber die letzten 30 Stunden vor dem Einbau: 128 von 143 Messungen mit dem
  # Grund "No module named 'playwright'", die uebrigen 11 stammten von einem
  # Entwicklerrechner, auf dem das Paket zufaellig lag.
  "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "respx>=0.21"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# AUSDRUECKLICHE AUSWAHL STATT DER VOREINSTELLUNG.
#
# Ruff hat seine Voreinstellung mit 0.16 erweitert, und weil dev "ruff>=0.6"
# erlaubt, installiert CI immer die neueste. Am 2026-08-30 ging der Lauf
# deshalb von einem Tag auf den anderen rot, mit 19 Meldungen in Dateien, an
# denen seit Wochen niemand etwas geaendert hatte. Was geprueft wird, gehoert
# in dieses Repo und nicht in die jeweils frisch gezogene Fassung.
#
# Nicht ausgewaehlt und warum: BLE001, S110 und S112 (breites except, except
# mit pass oder continue). Sie treffen hier ausschliesslich Stellen, an denen
# das Absicht ist und danebensteht, warum: ein sterbender Browser darf keinen
# Job abbrechen (website_browser), ein misslungenes Aufloesen eines
# Anbieter-Alarms auch nicht (main). Wer diese Regeln einschaltet, bekommt 15
# noqa-Kommentare und keinen einzigen gefundenen Fehler.
select = ["E4", "E7", "E9", "F", "I", "SIM", "FURB"]

[tool.pytest.ini_options]
# tests/test_confirm_unreachable.py holt sich HTML und fake_sb aus
# tests/test_check_website.py ("from tests.test_check_website import ..."), und
# dafuer muss apps/worker selbst importierbar sein.
#
# Lokal faellt das nicht auf, weil "python -m pytest" das aktuelle Verzeichnis
# von sich aus auf den Suchpfad legt. CI ruft "pytest" ohne -m auf, und dort
# fehlte es: ModuleNotFoundError beim Einsammeln, kein einziger Test gelaufen.
# Sichtbar wurde es erst am 2026-08-31, weil davor schon der Lint-Schritt
# abbrach und der Test-Schritt gar nicht mehr dran kam.
pythonpath = ["."]
